name: Lean Build & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Resolve dependencies
        run: lake update

      - name: Lake exe cache get
        run: lake exe cache get

      - name: Lake build
        run: lake build

      - name: Check for sorry or admit
        run: |
          if grep -rn -w --exclude-dir=".lake" --include="*.lean" "sorry" .; then
            echo "Error: found sorry in source"
            exit 1
          fi
          if grep -rn -w --exclude-dir=".lake" --include="*.lean" "admit" .; then
            echo "Error: found admit in source"
            exit 1
          fi
          echo "Verification passed: zero sorry, zero admit."
